<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Calculadora</title>

    <style>
        /* CSS */
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculadora {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            width: 300px;
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 30px;
            text-align: right;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .botoes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
        }

        button:hover {
            background-color: #ccc;
        }

        .igual {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <input type="text" id="display" value="0" disabled>

        <div class="botoes">
            <button onclick="limpar()">C</button>
            <button onclick="adicionar('(')">(</button>
            <button onclick="adicionar(')')">)</button>
            <button onclick="adicionar('/')">÷</button>

            <button onclick="adicionar('7')">7</button>
            <button onclick="adicionar('8')">8</button>
            <button onclick="adicionar('9')">9</button>
            <button onclick="adicionar('*')">×</button>

            <button onclick="adicionar('4')">4</button>
            <button onclick="adicionar('5')">5</button>
            <button onclick="adicionar('6')">6</button>
            <button onclick="adicionar('-')">−</button>

            <button onclick="adicionar('1')">1</button>
            <button onclick="adicionar('2')">2</button>
            <button onclick="adicionar('3')">3</button>
            <button onclick="adicionar('+')">+</button>

            <button onclick="adicionar('0')">0</button>
            <button onclick="adicionar('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>
        </div>

    </div>

    <script>
       // JavaScript

        function adicionar(valor) {
            let display = document.getElementById("display");

            if (display.value === "0") {
                display.value = valor;
            } else {
                display.value += valor;
            }
        }

        function limpar() {
            document.getElementById("display").value = "0";
        }

        function calcular() {
            let display = document.getElementById("display");

            try {
                display.value = eval(display.value);
            } catch {
                display.value = "Erro";
            }
        }
    </script>

</body>
</html>
